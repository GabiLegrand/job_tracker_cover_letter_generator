services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${LETTER_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LETTER_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LETTER_POSTGRES_DB}"
    volumes:
      - ${LETTER_PG_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverletter -d coverletter"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${COVER_PG_PUBLIC_PORT}:5432"
    networks:
      - job_tracking
  letter-backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Bind-mount source so edits on the host are picked up live by uvicorn --reload.
    # - app/          : Python source (hot-reloaded on save)
    # - alembic/      : migrations (apply on container restart)
    # - data/         : CV database (read-only)
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ${CV_DATA_PATH}:/app/data:ro
    ports:
      - "${API_COVER_PUBLIC_PORT}:8000"
    networks:
      - job_tracking
  letter-frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - letter-backend
    ports:
      - "${COVER_FE_PUBLIC_PORT}:80"
    networks:
      - job_tracking
networks:
  job_tracking:
    external: true
    name: job_tracking