services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coverletter
      POSTGRES_PASSWORD: coverletter
      POSTGRES_DB: coverletter
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverletter -d coverletter"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Bind-mount source so edits on the host are picked up live by uvicorn --reload.
    # - app/          : Python source (hot-reloaded on save)
    # - alembic/      : migrations (apply on container restart)
    # - data/         : CV database (read-only)
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - /home/gabi/job_search/resilent_data/data:/app/data:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
